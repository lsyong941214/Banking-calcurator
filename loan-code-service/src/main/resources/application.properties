spring.application.name=loan-code-service
# Local dev defaults to 8082; a hosted platform that injects PORT overrides this.
server.port=${PORT:8082}

# Local dev defaults match docker-compose.yml at the repo root (db/init.sql owns the schema).
# In production (Render), SPRING_DATASOURCE_HOST/PORT/DB/USERNAME/PASSWORD are wired from the
# managed Postgres instance via render.yaml's fromDatabase (its connection string uses the
# postgres:// scheme, which the JDBC driver can't parse directly -- so this composes a proper
# jdbc:postgresql:// URL from the individual pieces instead). Set SPRING_DATASOURCE_URL directly
# to override the composed value entirely if ever needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:loandb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:loanuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:loanpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by db/init.sql, not Hibernate or a migration tool (demo project, no Flyway/Liquibase yet).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The loan-calcurator screen (served from a different origin/port) calls this service directly.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
