<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이자계산</title>
<style>
  /* Toss TDS-derived tokens (see DESIGN.md) */
  :root {
    --color-primary: #3182f6;
    --color-primary-hover: #2272eb;
    --color-canvas: #ffffff;
    --color-foreground: #191f28;
    --color-body: #4e5968;
    --color-muted: #8b95a1;
    --color-surface: #f2f4f6;
    --color-border: #e5e8eb;
    --color-on-primary: #ffffff;
    --color-weak-bg: #e8f3ff;
    --color-weak-fg: #1b64da;
    --color-danger: #e42939;
    --color-danger-weak-bg: #fdecea;

    --font-sans: "Toss Product Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

    --space-xs: 4px; --space-sm: 6px; --space-md: 8px; --space-lg: 16px; --space-xl: 24px; --space-xxl: 32px;
    --radius-sm: 4px; --radius-md: 6px; --radius-btn-md: 10px; --radius-btn-lg: 14px; --radius-btn-xl: 16px;
    --radius-card: 14px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--color-surface);
    color: var(--color-foreground);
  }

  .app-shell { display: flex; min-height: 100vh; }

  /* --- Sidebar --- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--color-canvas);
    border-right: 1px solid var(--color-border);
    padding: var(--space-xl) var(--space-lg);
  }
  .sidebar .brand {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-foreground);
    margin-bottom: var(--space-xxl);
    padding: 0 var(--space-md);
  }
  .nav-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--color-body);
    padding: 12px var(--space-md);
    border-radius: var(--radius-btn-md);
    cursor: pointer;
    margin-bottom: var(--space-xs);
  }
  .nav-item:hover { background: var(--color-surface); }
  .nav-item.active { background: var(--color-weak-bg); color: var(--color-weak-fg); }

  /* --- Mobile hamburger + slide-in sidebar --- */
  .hamburger-btn {
    display: none;
    position: fixed;
    top: 16px; left: 16px;
    z-index: 1100;
    width: 44px; height: 44px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-btn-md);
    background: var(--color-canvas);
    cursor: pointer;
  }
  .hamburger-btn span {
    display: block;
    width: 20px; height: 2px;
    background: var(--color-foreground);
    border-radius: 1px;
  }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1040;
  }

  /* --- Main content --- */
  .content { flex: 1; padding: var(--space-xxl) var(--space-xxl) 80px; max-width: 920px; }
  .view { display: none; }
  .view.active { display: block; }

  h1 { font-size: 24px; font-weight: 600; line-height: 36px; margin: 0 0 var(--space-xl); color: var(--color-foreground); }

  .card {
    background: var(--color-canvas);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: var(--space-xl);
    margin-bottom: var(--space-lg);
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 var(--space-lg); color: var(--color-muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--space-lg) 20px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-body);
    margin-bottom: var(--space-sm);
  }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: var(--font-sans);
    background: var(--color-canvas);
    color: var(--color-foreground);
  }
  .field input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
  }
  .field input[readonly] { background: var(--color-surface); color: var(--color-muted); }
  .field input:disabled { background: var(--color-surface); color: var(--color-muted); }
  .field select {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: var(--font-sans);
    background: var(--color-canvas);
    color: var(--color-foreground);
  }
  .field select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
  }

  .rate-pair { display: flex; gap: var(--space-md); align-items: center; }
  .rate-pair input { width: 100%; }
  .rate-pair span { color: var(--color-muted); font-size: 13px; white-space: nowrap; }

  .checkbox-label {
    display: flex; align-items: center; gap: var(--space-sm);
    font-size: 13px; font-weight: 600; color: var(--color-body);
    white-space: nowrap; cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer; }

  button.primary {
    margin-top: var(--space-xl);
    background: var(--color-primary);
    color: var(--color-on-primary);
    border: none;
    border-radius: var(--radius-btn-xl);
    height: 56px;
    padding: 0 20px;
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button.primary:hover { background: var(--color-primary-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .tabs { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
  .tab-btn {
    flex: 1;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    background: var(--color-canvas);
    border-radius: var(--radius-btn-md);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--color-muted);
    cursor: pointer;
  }
  .tab-btn.active { background: var(--color-weak-bg); border-color: var(--color-primary); color: var(--color-weak-fg); }
  .tab-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .tab-btn:disabled.active { background: var(--color-surface); border-color: var(--color-border); color: var(--color-muted); }

  .fee-notice { color: var(--color-danger); font-size: 12px; margin-top: 4px; }

  table.result-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.result-table td { padding: 12px 6px; border-bottom: 1px solid var(--color-border); }
  table.result-table td.label { color: var(--color-body); width: 45%; }
  table.result-table td.value { text-align: right; font-variant-numeric: tabular-nums; }
  table.result-table tr.total td { border-top: 2px solid var(--color-foreground); border-bottom: none; font-weight: 700; padding-top: 16px; font-size: 17px; }

  .badge { display: inline-block; margin-left: var(--space-sm); padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; }
  .badge.overdue { background: var(--color-danger-weak-bg); color: var(--color-danger); }
  .badge.prepay { background: var(--color-weak-bg); color: var(--color-weak-fg); }
  .badge.ontime { background: var(--color-surface); color: var(--color-body); }

  .meta { color: var(--color-body); font-size: 14px; margin-bottom: var(--space-lg); }
  .error { color: var(--color-danger); font-size: 13px; margin-top: var(--space-md); display: none; }
  .placeholder { color: var(--color-muted); font-size: 14px; text-align: center; padding: 48px 0; }

  .schedule-table-wrap { max-height: 480px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  table.schedule-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.schedule-table thead th {
    position: sticky; top: 0;
    background: var(--color-surface);
    color: var(--color-body);
    font-weight: 600;
    text-align: right;
    padding: 10px 12px;
    border-bottom: 1px solid var(--color-border);
  }
  table.schedule-table thead th:first-child,
  table.schedule-table thead th:nth-child(2) { text-align: left; }
  table.schedule-table tbody td {
    padding: 9px 12px;
    text-align: right;
    border-bottom: 1px solid var(--color-border);
    font-variant-numeric: tabular-nums;
    color: var(--color-foreground);
  }
  table.schedule-table tbody td:first-child,
  table.schedule-table tbody td:nth-child(2) { text-align: left; color: var(--color-body); }
  table.schedule-table tbody tr:last-child td { font-weight: 700; }

  button.secondary {
    margin-top: var(--space-lg);
    background: var(--color-canvas);
    color: var(--color-weak-fg);
    border: 1px solid var(--color-primary);
    border-radius: var(--radius-btn-lg);
    height: 48px;
    padding: 0 20px;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button.secondary:hover { background: var(--color-weak-bg); }
  button.secondary.btn-sm { margin-top: 0; height: 36px; padding: 0 12px; width: auto; font-size: 13px; }

  .ledger-table-wrap { max-height: 480px; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  table.ledger-table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  table.ledger-table thead th {
    position: sticky; top: 0;
    background: var(--color-surface);
    color: var(--color-body);
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--color-border);
  }
  table.ledger-table tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-foreground);
  }
  table.ledger-table td.num, table.ledger-table th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .rate-pair input.applied-rate { font-weight: 700; color: var(--color-foreground); }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    vertical-align: -3px;
    margin-right: 8px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--color-canvas);
    border-radius: var(--radius-card);
    padding: var(--space-xl);
    max-width: 360px;
    width: calc(100% - 48px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
  }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--color-foreground); margin-bottom: var(--space-md); }
  .modal-message { font-size: 14px; color: var(--color-body); margin-bottom: var(--space-xl); white-space: pre-wrap; }
  .modal button.primary { margin-top: 0; }

  /* Mobile overrides come last so they win over the base .sidebar/.content rules above */
  @media (max-width: 768px) {
    .hamburger-btn { display: flex; }
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 1050;
      padding-top: 76px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.15);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .content { padding-top: 76px; }
  }
</style>
</head>
<body>
<button class="hamburger-btn" id="menuToggle" aria-label="메뉴 열기">
  <span></span><span></span><span></span>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">대출계산기</div>
    <button class="nav-item" data-view="account-create">계좌생성</button>
    <button class="nav-item" data-view="ledger">원장조회</button>
    <button class="nav-item active" data-view="interest">이자계산</button>
    <button class="nav-item" data-view="deposit">입금</button>
  </nav>

  <main class="content">

    <!-- ===================== 이자계산 ===================== -->
    <section id="view-interest" class="view active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-xl);">
        <h1 style="margin:0;">이자계산</h1>
        <button type="button" class="secondary btn-sm" id="i-resetBtn">초기화</button>
      </div>

      <div class="card">
        <h2>입력</h2>
        <div class="grid">
          <div class="field">
            <label for="i-newDate">신규일자</label>
            <input type="date" id="i-newDate" />
          </div>
          <div class="field">
            <label for="i-maturityDate">만기일자</label>
            <input type="date" id="i-maturityDate" readonly placeholder="자동 계산" />
          </div>
          <div class="field">
            <label for="i-loanTermYears">대출기간</label>
            <select id="i-loanTermYears"></select>
          </div>
          <div class="field">
            <label for="i-referenceDate">계산기준일자</label>
            <input type="date" id="i-referenceDate" />
          </div>
          <div class="field">
            <label>기준금리 + 가산금리 = 적용금리</label>
            <div class="rate-pair">
              <input type="text" inputmode="decimal" id="i-baseRate" placeholder="0.00%" />
              <span>+</span>
              <input type="text" inputmode="decimal" id="i-spreadRate" placeholder="0.00%" />
              <span>=</span>
              <input type="text" class="applied-rate" id="i-appliedRate" disabled placeholder="0.00%" style="max-width:90px" />
            </div>
          </div>
          <div class="field">
            <label for="i-productType">상품</label>
            <select id="i-productType">
              <option value="01">주택담보대출</option>
              <option value="02">전세자금대출</option>
              <option value="03">신용대출</option>
            </select>
          </div>
          <div class="field">
            <label for="i-outstandingPrincipal">대출잔액 (원)</label>
            <input type="text" inputmode="numeric" id="i-outstandingPrincipal" placeholder="예: 100,000,000" />
          </div>
          <div class="field">
            <label for="i-partialRepaymentAmount">일부상환금액 (원)</label>
            <input type="text" inputmode="numeric" id="i-partialRepaymentAmount" placeholder="예: 10,000,000" />
          </div>
          <div class="field">
            <label>중도상환수수료율 (%)</label>
            <div class="rate-pair">
              <input type="text" inputmode="decimal" id="i-feeRate" value="1" />
              <label class="checkbox-label"><input type="checkbox" id="i-feeExempt" /> 면제</label>
            </div>
          </div>
        </div>
        <button class="primary" id="i-calcBtn">계산하기</button>
      </div>

      <div class="card">
        <h2>결과</h2>
        <div class="tabs">
          <button class="tab-btn active" data-type="EQUAL_PRINCIPAL_AND_INTEREST">원리금균등상환</button>
          <button class="tab-btn" data-type="EQUAL_PRINCIPAL">원금균등상환</button>
          <button class="tab-btn" data-type="BULK">만기일시상환</button>
        </div>
        <div id="i-resultArea"><div class="placeholder">좌측 입력 후 계산하기를 눌러주세요.</div></div>
        <button type="button" class="secondary" id="i-scheduleToggleBtn">상환스케줄 미리보기</button>
        <div id="i-scheduleArea" style="display:none; margin-top: var(--space-lg);"></div>
      </div>
    </section>

    <!-- ===================== 계좌생성 ===================== -->
    <section id="view-account-create" class="view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-xl);">
        <h1 style="margin:0;">계좌생성</h1>
        <div style="display:flex; align-items:center; gap: var(--space-md);">
          <div style="display:flex; align-items:center; gap: var(--space-sm);">
            <label for="c-txnType" style="font-size:13px; font-weight:600; color: var(--color-body); white-space:nowrap;">처리구분</label>
            <select id="c-txnType" style="height:36px; padding:0 8px; border:1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size:13px; background: var(--color-canvas); color: var(--color-foreground);">
              <option value="CREATE">등록</option>
              <option value="UPDATE">변경</option>
              <option value="DELETE">삭제</option>
            </select>
          </div>
          <button type="button" class="secondary btn-sm" id="c-resetBtn">초기화</button>
        </div>
      </div>

      <div class="card" id="c-lookupCard">
        <h2>계좌 조회</h2>
        <div style="display:flex; gap: var(--space-md); align-items:flex-end;">
          <div class="field" style="flex:1; margin:0;">
            <label for="c-acctNo">계좌번호</label>
            <input type="text" id="c-acctNo" readonly placeholder="계좌 검색으로 선택하세요" />
          </div>
          <div class="field" style="width:76px; flex-shrink:0; margin:0;">
            <label for="c-acctSeqNo">일련번호</label>
            <input type="text" id="c-acctSeqNo" readonly placeholder="-" />
          </div>
          <button type="button" class="secondary btn-sm" id="c-acctSearchBtn" style="flex-shrink:0;">계좌 검색</button>
        </div>
        <div class="meta" id="c-modeLabel" style="margin-top: var(--space-lg); margin-bottom:0;">계좌를 검색해 불러오세요.</div>
      </div>

      <div class="card">
        <h2>계좌 정보</h2>
        <div class="grid">
          <div class="field"><label for="c-custNo">고객번호</label><input type="text" inputmode="numeric" id="c-custNo" maxlength="10" placeholder="예: 2026000001 (10자리)" /></div>
          <div class="field"><label for="c-custName">고객명</label><input type="text" id="c-custName" placeholder="예: 홍길동" /></div>
          <div class="field c-auto-field">
            <label for="c-acctStatCd">계좌상태</label>
            <select id="c-acctStatCd">
              <option value="01">정상</option>
              <option value="03">정리</option>
              <option value="04">해지</option>
              <option value="05">상각</option>
              <option value="09">매각</option>
            </select>
          </div>
          <div class="field">
            <label for="c-itemCd">과목</label>
            <select id="c-itemCd">
              <option value="01">주택담보대출</option>
              <option value="02">전세자금대출</option>
              <option value="03">신용대출</option>
            </select>
          </div>
          <div class="field"><label for="c-loanLimitAmt">대출한도 (원)</label><input type="text" inputmode="numeric" id="c-loanLimitAmt" placeholder="예: 100,000,000" /></div>
          <div class="field c-auto-field"><label for="c-loanBalAmt">대출잔액 (원)</label><input type="text" inputmode="numeric" id="c-loanBalAmt" placeholder="예: 100,000,000" /></div>
          <div class="field"><label for="c-newDt">신규일자</label><input type="text" inputmode="numeric" id="c-newDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field"><label for="c-matDt">만기일자</label><input type="text" inputmode="numeric" id="c-matDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field c-auto-field"><label for="c-nextIntPayDt">다음이자납입일자</label><input type="text" inputmode="numeric" id="c-nextIntPayDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field c-auto-field"><label for="c-nextRepayDt">다음상환일자</label><input type="text" inputmode="numeric" id="c-nextRepayDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field c-auto-field"><label for="c-lastIntPayDt">최종이자납입일자</label><input type="text" inputmode="numeric" id="c-lastIntPayDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field c-auto-field"><label for="c-lastRepayDt">최종상환일자</label><input type="text" inputmode="numeric" id="c-lastRepayDt" maxlength="10" placeholder="예: 20560816" /></div>
          <div class="field c-auto-field"><label for="c-deadlineLossDt">기한이익상실일자</label><input type="text" inputmode="numeric" id="c-deadlineLossDt" maxlength="10" placeholder="예: 20560916" /></div>
          <div class="field"><label for="c-monthlyIntPayDay">매월이자납입일</label><input type="text" inputmode="numeric" id="c-monthlyIntPayDay" maxlength="2" placeholder="예: 10 (1~31, 2자리)" /></div>
          <div class="field">
            <label>기준금리 + 가산금리 = 적용금리 (%)</label>
            <div class="rate-pair">

<script>
const $ = (id) => document.getElementById(id);

function formatWon(v) {
  return Number(v).toLocaleString('ko-KR') + '원';
}

function attachAmountFormatting(input) {
  input.addEventListener('input', () => {
    const raw = input.value.replace(/[^0-9]/g, '');
    input.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
  });
}

function parseAmount(input) {
  const raw = input.value.replace(/[^0-9]/g, '');
  return raw ? Number(raw) : NaN;
}

// 숫자와 소수점만 허용, 소수점 이하 2자리까지만 입력 가능
function attachRateFormatting(input) {
  input.addEventListener('input', () => {
    let v = input.value.replace(/[^0-9.]/g, '');
    const firstDot = v.indexOf('.');
    if (firstDot !== -1) {
      v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
      v = v.slice(0, firstDot + 3);
    }
    input.value = v;
  });
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

// 네이티브 <input type="date">의 연/월/일 분리 입력 UX 대신, 숫자만 이어붙여 타이핑해도
// YYYY-MM-DD로 자동 포맷되는 텍스트 입력용 -- 자릿수 8개(YYYYMMDD)로 캡, 4/6번째 자리 뒤에
// 자동으로 대시를 넣는다. 계좌생성 화면처럼 키패드로 바로 날짜를 입력해야 하는 곳에서 사용.
function attachDateFormatting(input) {
  input.addEventListener('input', () => {
    const digits = input.value.replace(/[^0-9]/g, '').slice(0, 8);
    let formatted = digits;
    if (digits.length > 4) formatted = `${digits.slice(0, 4)}-${digits.slice(4)}`;
    if (digits.length > 6) formatted = `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6)}`;
    input.value = formatted;
  });
}

// attachDateFormatting으로 입력된 값이 실제로 유효한 날짜(YYYY-MM-DD, 월 1~12, 일 해당 월의
// 말일 이내)인지 검증한다 -- 텍스트 입력이라 네이티브 date input과 달리 브라우저가 걸러주지 않는다.
function isValidDateInput(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!match) return false;
  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  if (month < 1 || month > 12) return false;
  const daysInMonth = new Date(year, month, 0).getDate();
  return day >= 1 && day <= daysInMonth;
}

// 이 화면(loan-calcurator)은 정적 화면만 서빙하고, 실제 업무 로직은 전부 아래 4개
// 서비스를 직접 호출해서 처리한다 (업무기능별 서비스 분리).
//   - loan-engine-service   : 이자계산 (입력 -> 계산 -> 결과 반환)
//   - loan-schedule-service : 상환스케줄 미리보기 생성
//   - loan-code-service     : 화면 on_load 시 상품/상환방식/대출기간 유효값 조회 (DB)
//   - loan-ledger-service   : 원장조회 (대출계좌원장 lon_acct_base 조회, 이자계산 화면에 값 전달)
// 로컬에서는 포트로 구분해서 띄운다. TODO: loan-engine/schedule/code-service를 각각
// Render에 배포하면 아래 두 번째 값을 실제 배포 주소로 바꿔야 한다.
const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const ENGINE_SERVICE_BASE = IS_LOCAL ? 'http://localhost:8081' : 'https://loan-engine-service.onrender.com';
const SCHEDULE_SERVICE_BASE = IS_LOCAL ? 'http://localhost:8083' : 'https://loan-schedule-service.onrender.com';
const CODE_SERVICE_BASE = IS_LOCAL ? 'http://localhost:8082' : 'https://loan-code-service.onrender.com';
const LEDGER_SERVICE_BASE = IS_LOCAL ? 'http://localhost:8084' : 'https://loan-ledger-service.onrender.com';

// Render 무료 플랜은 15분 이상 요청이 없으면 인스턴스가 슬립 상태로 내려가고, 다음 요청은
// 컨테이너를 다시 띄우느라 30~50초씩 걸린다 ("계산하기가 느리다"의 실제 원인 대부분이 이것).
// loan-code-service는 화면 로드 시 이미 호출되어 자연히 깨어나므로 제외하고, 나머지 세
// 서비스는 화면을 켜자마자 미리 깨워둔다 -- 사용자가 폼을 채우는 몇 초~몇십 초 동안 백그라운드에서
// 기동이 끝나 있으면, 실제로 "계산하기"를 누를 때는 이미 웜업된 상태일 가능성이 높다.
// no-cors로 쏘고 응답 내용/에러 모두 무시한다 (깨우는 목적일 뿐 결과가 필요 없음).
function warmUpBackend(base) {
  fetch(base, { mode: 'no-cors' }).catch(() => {});
}
[ENGINE_SERVICE_BASE, SCHEDULE_SERVICE_BASE, LEDGER_SERVICE_BASE].forEach(warmUpBackend);

// ---------- Error popup ----------
function showErrorModal(message) {
  $('errorModalMessage').textContent = message;
  $('errorModalOverlay').classList.add('open');
}
function closeErrorModal() {
  $('errorModalOverlay').classList.remove('open');
}
$('errorModalCloseBtn').addEventListener('click', closeErrorModal);
$('errorModalOverlay').addEventListener('click', (e) => {
  if (e.target === $('errorModalOverlay')) closeErrorModal();
});

// ---------- Account search popup (이자계산/원장조회 화면 공용) ----------
// 원장조회 화면의 계좌번호 검색과 이자계산 화면의 계좌번호 검색이 동일한 팝업을 공유한다.
// openAccountSearchModal(onSelect)로 열면, 목록에서 "선택"을 누른 계좌 전체 데이터가
// onSelect(account)로 전달된다.
const ACCT_STAT_LABELS = { '01': '정상', '03': '정리', '04': '해지', '05': '상각', '09': '매각' };
const ITEM_LABELS = { '01': '주택담보대출', '02': '전세자금대출', '03': '신용대출' };
const REPAY_METHOD_LABELS = { '01': '원리금균등', '02': '원금균등', '03': '만기일시' };
const RATE_CHANGE_TYPE_LABELS = { '01': '고정금리', '02': '변동금리' };

function formatDtDash(s) {
  return s ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}` : '-';
}

function formatRatePct(v) {
  return v == null ? '-' : (Number(v) * 100).toFixed(2) + '%';
}

function rateChangeInfoText(account) {
  if (!account.rateChangeTypeCd) return '';
  const label = RATE_CHANGE_TYPE_LABELS[account.rateChangeTypeCd] || account.rateChangeTypeCd;
  return account.rateChangeTypeCd === '02' && account.rateChangeCycle
    ? `${label} (${Number(account.rateChangeCycle)}개월 주기)`
    : label;
}

(function () {
  let onAccountSelected = null;

  function renderAccountSearchResults(accounts) {
    if (!accounts.length) {
      $('as-resultArea').innerHTML = '<div class="placeholder">조회된 계좌가 없습니다.</div>';
      return;
    }
    const rows = accounts.map((a, idx) => `
      <tr>
        <td>${a.acctNo}</td>
        <td>${formatDtDash(a.newDt)}</td>
        <td class="num">${formatWon(a.loanLimitAmt)}</td>
        <td class="num">${formatWon(a.loanBalAmt)}</td>
        <td>${ACCT_STAT_LABELS[a.acctStatCd] || a.acctStatCd}</td>
        <td><button type="button" class="secondary btn-sm" data-idx="${idx}">선택</button></td>
      </tr>
    `).join('');

    $('as-resultArea').innerHTML = `
      <div class="ledger-table-wrap">
        <table class="ledger-table">
          <thead>
            <tr><th>계좌번호</th><th>신규일자</th><th class="num">대출금액</th><th class="num">대출잔액</th><th>계좌상태</th><th></th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    $('as-resultArea').querySelectorAll('button[data-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const account = accounts[Number(btn.dataset.idx)];
        closeAccountSearchModal();
        if (onAccountSelected) onAccountSelected(account);
      });
    });
  }

  async function runAccountSearch() {
    $('as-resultArea').innerHTML = '<div class="placeholder">불러오는 중...</div>';
    try {
      const url = new URL(`${LEDGER_SERVICE_BASE}/api/v1/ledger/accounts/search`);
      const custNo = $('as-custNo').value.trim();
      const custName = $('as-custName').value.trim();
      const acctStatCd = $('as-acctStatCd').value;
      if (custNo) url.searchParams.set('custNo', custNo);
      if (custName) url.searchParams.set('custName', custName);
      if (acctStatCd) url.searchParams.set('acctStatCd', acctStatCd);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderAccountSearchResults(await res.json());
    } catch (e) {
      $('as-resultArea').innerHTML = `<div class="error" style="display:block;">계좌 검색 중 오류가 발생했습니다: ${e.message}</div>`;
    }
  }

  window.openAccountSearchModal = function (onSelect) {
    onAccountSelected = onSelect;
    $('as-custNo').value = '';
    $('as-custName').value = '';
    $('as-acctStatCd').value = '';
    $('as-resultArea').innerHTML = '<div class="placeholder">검색 조건을 입력하고 검색을 눌러주세요.</div>';
    $('acctSearchModalOverlay').classList.add('open');
  };
  function closeAccountSearchModal() {
    $('acctSearchModalOverlay').classList.remove('open');
  }

  $('as-searchBtn').addEventListener('click', runAccountSearch);
  $('as-closeBtn').addEventListener('click', closeAccountSearchModal);
  $('acctSearchModalOverlay').addEventListener('click', (e) => {
    if (e.target === $('acctSearchModalOverlay')) closeAccountSearchModal();
  });
})();

// ---------- Sidebar navigation ----------
// 각 view의 IIFE가 자신의 초기화 함수를 VIEW_RESETTERS[data-view 값]에, 처음 전환될 때만
// 할 일(예: 최초 1회 자동 조회)이 있다면 VIEW_ON_FIRST_SHOW[data-view 값]에 등록한다.
// 새 화면을 추가할 때도 반드시 초기화 함수를 만들어 여기 등록할 것 (프로젝트 컨벤션).
const VIEW_RESETTERS = {};
const VIEW_ON_FIRST_SHOW = {};

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const wasActive = btn.classList.contains('active');
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    $('view-' + btn.dataset.view).classList.add('active');
    closeSidebar();
    if (wasActive) {
      // 이미 활성화된 메뉴를 다시 누른 경우에도 초기화한다.
      const reset = VIEW_RESETTERS[btn.dataset.view];
      if (reset) reset();
    } else {
      const onFirstShow = VIEW_ON_FIRST_SHOW[btn.dataset.view];
      if (onFirstShow) onFirstShow();
    }
  });
});

// ================= 이자계산 view =================
(function () {
  let lastResponse = null;
  let activeType = 'EQUAL_PRINCIPAL_AND_INTEREST';
  let lastScheduleResponse = null;
  let scheduleVisible = false;

  attachAmountFormatting($('i-outstandingPrincipal'));
  attachAmountFormatting($('i-partialRepaymentAmount'));
  attachRateFormatting($('i-baseRate'));
  attachRateFormatting($('i-spreadRate'));
  attachRateFormatting($('i-feeRate'));

  // loan-code-service가 DB(code_item/product_repayment_type_rule/product_loan_term_rule)를
  // 소유한다. 여기 있는 값은 그 서비스에 못 닿을 때만 쓰는 폴백이며, 정상 응답이 오면
  // loadProductCodesFromServer()가 즉시 덮어쓴다.
  const DEFAULT_PRODUCT_OPTIONS = [
    { code: '01', name: '주택담보대출', allowedRepaymentTypes: ['EQUAL_PRINCIPAL_AND_INTEREST', 'EQUAL_PRINCIPAL'], allowedLoanTermYears: [10, 20, 30, 40] },
    { code: '02', name: '전세자금대출', allowedRepaymentTypes: ['BULK'], allowedLoanTermYears: [1, 2] },
    { code: '03', name: '신용대출', allowedRepaymentTypes: ['EQUAL_PRINCIPAL_AND_INTEREST', 'EQUAL_PRINCIPAL', 'BULK'], allowedLoanTermYears: [1, 2] }
  ];
  const DEFAULT_REPAYMENT_TYPES = [
    { code: 'EQUAL_PRINCIPAL_AND_INTEREST', name: '원리금균등상환' },
    { code: 'EQUAL_PRINCIPAL', name: '원금균등상환' },
    { code: 'BULK', name: '만기일시상환' }
  ];
  let productOptions = DEFAULT_PRODUCT_OPTIONS;

  function getProductOption(productCode) {
    return productOptions.find(p => p.code === productCode);
  }

  function switchTab(type) {
    document.querySelectorAll('#view-interest .tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);
    });
    activeType = type;
    renderResult(activeType);
    if (scheduleVisible) renderSchedule(activeType);
  }

  function applyProductRestrictions() {
    const option = getProductOption($('i-productType').value);
    const allowed = option ? option.allowedRepaymentTypes : [];
    document.querySelectorAll('#view-interest .tab-btn').forEach(btn => {
      btn.disabled = !allowed.includes(btn.dataset.type);
    });
    if (!allowed.includes(activeType)) {
      switchTab(allowed[0]);
    }
  }

  function applyRepaymentTypeLabels(repaymentTypes) {
    repaymentTypes.forEach(rt => {
      document.querySelectorAll(`.tab-btn[data-type="${rt.code}"]`).forEach(btn => {
        btn.textContent = rt.name;
      });
    });
  }

  function renderProductTypeOptions() {
    const select = $('i-productType');
    const prevValue = select.value;
    select.innerHTML = productOptions.map(p => `<option value="${p.code}">${p.name}</option>`).join('');
    select.value = productOptions.some(p => p.code === prevValue) ? prevValue : productOptions[0].code;
  }

  function applyProductOptions(options) {
    if (!Array.isArray(options) || options.length === 0) return;
    productOptions = options;
    renderProductTypeOptions();
    applyProductRestrictions();
    populateLoanTermOptions();
    recalcMaturityDate();
  }

  async function loadProductCodesFromServer() {
    try {
      const [productRes, repaymentRes] = await Promise.all([
        fetch(`${CODE_SERVICE_BASE}/api/v1/codes/product-options`),
        fetch(`${CODE_SERVICE_BASE}/api/v1/codes/repayment-types`)
      ]);
      if (!productRes.ok || !repaymentRes.ok) throw new Error(`HTTP ${productRes.status}/${repaymentRes.status}`);
      applyProductOptions(await productRes.json());
      applyRepaymentTypeLabels(await repaymentRes.json());
    } catch (e) {
      console.warn('[loan-code-service] 상품/상환방식 코드 조회 실패 - 기본값을 계속 사용합니다:', e.message);
    }
  }

  function populateLoanTermOptions() {
    const option = getProductOption($('i-productType').value);
    const years = (option && option.allowedLoanTermYears.length) ? option.allowedLoanTermYears : [1, 2];
    const select = $('i-loanTermYears');
    const prevValue = select.value;
    select.innerHTML = years.map(y => `<option value="${y}">${y}년</option>`).join('');
    select.value = years.includes(Number(prevValue)) ? prevValue : String(years[0]);
  }

  function recalcMaturityDate() {
    const newDateVal = $('i-newDate').value;
    const years = Number($('i-loanTermYears').value);
    if (!newDateVal || !years) {
      $('i-maturityDate').value = '';
      return;
    }
    const d = new Date(newDateVal);
    d.setFullYear(d.getFullYear() + years);
    $('i-maturityDate').value = isoDate(d);
  }

  $('i-productType').addEventListener('change', () => {
    applyProductRestrictions();
    populateLoanTermOptions();
    recalcMaturityDate();
  });
  $('i-loanTermYears').addEventListener('change', recalcMaturityDate);
  $('i-newDate').addEventListener('input', recalcMaturityDate);

  const today = new Date();
  const referenceDefault = new Date(today);
  referenceDefault.setMonth(referenceDefault.getMonth() + 1);
  $('i-newDate').value = isoDate(today);
  $('i-referenceDate').value = isoDate(referenceDefault);
  $('i-partialRepaymentAmount').value = '0';

  function updateDerivedFields() {
    const base = parseFloat($('i-baseRate').value);
    const spread = parseFloat($('i-spreadRate').value);
    $('i-appliedRate').value = (!isNaN(base) && !isNaN(spread)) ? (base + spread).toFixed(2) + '%' : '';
  }
  ['i-baseRate', 'i-spreadRate'].forEach(id => {
    $(id).addEventListener('input', updateDerivedFields);
  });
  updateDerivedFields();
  applyProductRestrictions();
  populateLoanTermOptions();
  recalcMaturityDate();
  loadProductCodesFromServer();

  $('i-feeExempt').addEventListener('change', () => {
    if ($('i-feeExempt').checked) {
      $('i-feeRate').value = '0';
      $('i-feeRate').disabled = true;
    } else {
      $('i-feeRate').value = '1';
      $('i-feeRate').disabled = false;
    }
  });

  const EXEMPTION_LABELS = {
    THREE_YEARS_ELAPSED: '① 대출 후 3년 경과 - 중도상환수수료 전액 면제',
    ANNUAL_TEN_PERCENT: '② 대출원금 10% 이내 일부상환 - 중도상환수수료 면제'
  };

  function renderResult(type) {
    if (!lastResponse) return;
    const r = lastResponse.results.find(x => x.repaymentType === type);
    if (!r) return;

    let badge;
    if (r.overdueDays > 0) badge = `<span class="badge overdue">연체 ${r.overdueDays}일</span>`;
    else if (r.prepaymentDays > 0) badge = `<span class="badge prepay">선납 ${r.prepaymentDays}일</span>`;
    else badge = `<span class="badge ontime">정시납부</span>`;

    let feeNotices = '';
    const exemptionLabel = EXEMPTION_LABELS[lastResponse.earlyRepaymentFeeExemptionReason];
    if (exemptionLabel) feeNotices += `<div class="fee-notice">${exemptionLabel}</div>`;
    if (lastResponse.withdrawalPeriodApplicable) feeNotices += `<div class="fee-notice">* 청약철회 가능여부 확인</div>`;

    $('i-resultArea').innerHTML = `
      <div class="meta">납부(약정)일자: <strong>${r.dueDate}</strong> · 회차수: ${r.remainingInstallments}회 ${badge}</div>
      <table class="result-table">
        <tr><td class="label">원금</td><td class="value">${formatWon(r.principal)}</td></tr>
        <tr><td class="label">원금연체이자</td><td class="value">${formatWon(r.overduePrincipalInterest)}</td></tr>
        <tr><td class="label">이자</td><td class="value">${formatWon(r.interest)}</td></tr>
        <tr><td class="label">연체이자</td><td class="value">${formatWon(r.overdueInterest)}</td></tr>
        <tr><td class="label">선납이자 (선납일수 ${r.prepaymentDays}일)</td><td class="value">- ${formatWon(r.prepaymentInterest)}</td></tr>
        <tr><td class="label">중도상환수수료</td><td class="value">${formatWon(r.earlyRepaymentFee)}${feeNotices}</td></tr>
        <tr class="total"><td class="label">기준일자 납부금액</td><td class="value">${formatWon(r.totalDueAmount)}</td></tr>
      </table>
    `;
  }

  document.querySelectorAll('#view-interest .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.type));
  });

  // ---------- 상환스케줄 미리보기 ----------
  function renderSchedule(type) {
    if (!lastScheduleResponse) return;
    const r = lastScheduleResponse.results.find(x => x.repaymentType === type);
    if (!r) return;

    const rows = r.installments.map(row => `
      <tr>
        <td>${row.sequence}회</td>
        <td>${row.dueDate}</td>
        <td>${formatWon(row.principalPayment)}</td>
        <td>${formatWon(row.interestPayment)}</td>
        <td>${formatWon(row.totalPayment)}</td>
        <td>${formatWon(row.remainingBalance)}</td>
      </tr>
    `).join('');

    $('i-scheduleArea').innerHTML = `
      <div class="meta">총 ${r.installments.length}회차</div>
      <div class="schedule-table-wrap">
        <table class="schedule-table">
          <thead>
            <tr><th>회차</th><th>납부일</th><th>원금</th><th>이자</th><th>납입액</th><th>잔액</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  async function fetchAndRenderSchedule() {
    const payload = {
      newDate: $('i-newDate').value,
      maturityDate: $('i-maturityDate').value,
      baseRate: parseFloat($('i-baseRate').value) / 100,
      spreadRate: parseFloat($('i-spreadRate').value) / 100,
      principal: parseAmount($('i-outstandingPrincipal'))
    };

    if (!payload.newDate || !payload.maturityDate ||
        isNaN(payload.baseRate) || isNaN(payload.spreadRate) || isNaN(payload.principal)) {
      $('i-scheduleArea').innerHTML = '<div class="error" style="display:block;">상환스케줄을 보려면 신규일자·만기일자·금리·대출잔액을 입력해주세요.</div>';
      return;
    }

    $('i-scheduleArea').innerHTML = '<div class="placeholder">불러오는 중...</div>';
    try {
      const res = await fetch(`${SCHEDULE_SERVICE_BASE}/api/v1/repayment-schedules`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '상환스케줄 조회 중 오류가 발생했습니다.');
      lastScheduleResponse = data;
      renderSchedule(activeType);
    } catch (e) {
      $('i-scheduleArea').innerHTML = `<div class="error" style="display:block;">${e.message}</div>`;
    }
  }

  $('i-scheduleToggleBtn').addEventListener('click', () => {
    scheduleVisible = !scheduleVisible;
    $('i-scheduleArea').style.display = scheduleVisible ? 'block' : 'none';
    $('i-scheduleToggleBtn').textContent = scheduleVisible ? '상환스케줄 숨기기' : '상환스케줄 미리보기';
    if (scheduleVisible) fetchAndRenderSchedule();
  });

  $('i-calcBtn').addEventListener('click', async () => {
    const partialRepaymentAmountRaw = parseAmount($('i-partialRepaymentAmount'));
    const payload = {
      newDate: $('i-newDate').value,
      maturityDate: $('i-maturityDate').value,
      baseRate: parseFloat($('i-baseRate').value) / 100,
      spreadRate: parseFloat($('i-spreadRate').value) / 100,
      outstandingPrincipal: parseAmount($('i-outstandingPrincipal')),
      referenceDate: $('i-referenceDate').value,
      earlyRepaymentFeeRate: parseFloat($('i-feeRate').value) / 100,
      partialRepaymentAmount: isNaN(partialRepaymentAmountRaw) ? 0 : partialRepaymentAmountRaw
    };

    if (!payload.newDate || !payload.maturityDate || !payload.referenceDate ||
        isNaN(payload.baseRate) || isNaN(payload.spreadRate) || isNaN(payload.outstandingPrincipal)) {
      showErrorModal('신규일자, 만기일자, 계산기준일자, 금리, 대출잔액을 모두 입력해주세요.');
      return;
    }

    const calcBtn = $('i-calcBtn');
    const originalLabel = calcBtn.textContent;
    calcBtn.disabled = true;
    calcBtn.innerHTML = '<span class="spinner"></span>계산 중...';
    // 4초 넘게 걸리면 십중팔구 무료 호스팅 콜드스타트다 -- 멈춘 것처럼 보이지 않게 안내를 바꿔준다.
    const slowHintTimer = setTimeout(() => {
      calcBtn.innerHTML = '<span class="spinner"></span>서버를 깨우는 중... (최대 50초)';
    }, 4000);
    try {
      const res = await fetch(`${ENGINE_SERVICE_BASE}/api/v1/interest-calculations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '계산 중 오류가 발생했습니다.');
      lastResponse = data;
      renderResult(activeType);
      if (scheduleVisible) fetchAndRenderSchedule();
    } catch (e) {
      showErrorModal(e.message || '계산 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    } finally {
      clearTimeout(slowHintTimer);
      calcBtn.disabled = false;
      calcBtn.textContent = originalLabel;
    }
  });

  // 계좌번호 입력/조회 연동은 이자계산 화면에서 제거하고 입금 화면(window.fillDepositFormFromLedger)
  // 으로 옮겼다 -- 이 화면은 순수 시뮬레이션(수동 입력값 계산)만 담당한다.

  function resetInterestForm() {
    lastResponse = null;
    lastScheduleResponse = null;

    $('i-productType').value = productOptions[0].code;
    applyProductRestrictions();
    populateLoanTermOptions();
    switchTab('EQUAL_PRINCIPAL_AND_INTEREST');

    $('i-newDate').value = isoDate(new Date());
    recalcMaturityDate();

    const referenceDefault = new Date();
    referenceDefault.setMonth(referenceDefault.getMonth() + 1);
    $('i-referenceDate').value = isoDate(referenceDefault);

    $('i-baseRate').value = '';
    $('i-spreadRate').value = '';
    updateDerivedFields();

    $('i-outstandingPrincipal').value = '';
    $('i-partialRepaymentAmount').value = '0';

    $('i-feeExempt').checked = false;
    $('i-feeRate').disabled = false;
    $('i-feeRate').value = '1';

    $('i-resultArea').innerHTML = '<div class="placeholder">좌측 입력 후 계산하기를 눌러주세요.</div>';

    scheduleVisible = false;
    $('i-scheduleArea').style.display = 'none';
    $('i-scheduleArea').innerHTML = '';
    $('i-scheduleToggleBtn').textContent = '상환스케줄 미리보기';
  }

  $('i-resetBtn').addEventListener('click', resetInterestForm);
  VIEW_RESETTERS.interest = resetInterestForm;
})();

// ================= 계좌생성(CRUD) view =================
(function () {
  let txnType = 'CREATE'; // CREATE(등록) / UPDATE(변경) / DELETE(삭제) -- c-txnType 선택값과 동기화
  let editingAccount = null; // 변경/삭제 대상 PK, 계좌검색 팝업으로만 채워진다.

  // 등록 시 서버가 자동 계산하는 필드(계좌상태/대출잔액/납입일자 등)의 .field 래퍼 --
  // 등록 모드에서는 숨기고, 변경/삭제에서는 계좌검색으로 불러온 실제 값을 보여준다.
  const AUTO_FIELD_IDS = ['acctStatCd', 'loanBalAmt', 'nextIntPayDt', 'nextRepayDt', 'lastIntPayDt', 'lastRepayDt', 'deadlineLossDt'];
  // 처리구분에 따라 잠글(readonly/disabled) 입력 필드 전체 -- acctNo/acctSeqNo는 항상 readonly라 제외.
  const LOCKABLE_FIELD_IDS = ['custNo', 'custName', 'itemCd', 'loanLimitAmt', 'newDt', 'matDt', 'monthlyIntPayDay',
    'baseRate', 'addRate', 'earlyRepayFeeRate', 'repayMethodCd', 'rateChangeTypeCd', 'rateChangeCycle', ...AUTO_FIELD_IDS];
  // 처리(등록/변경) 전 필수입력 검증 메시지 -- 등록은 loanBalAmt 제외, 변경은 전부 포함(validateFormForSubmit 참고).
  const REQUIRED_FIELD_MESSAGES = {
    custNo: '고객번호는 필수입력사항입니다.',
    custName: '고객명은 필수입력사항입니다.',
    loanLimitAmt: '대출한도는 필수입력사항입니다.',
    newDt: '신규일자는 필수입력사항입니다.',
    matDt: '만기일자는 필수입력사항입니다.',
    monthlyIntPayDay: '매월이자납입일은 필수입력사항입니다.',
    baseRate: '기준금리는 필수입력사항입니다.',
    addRate: '가산금리는 필수입력사항입니다.',
    earlyRepayFeeRate: '조기상환수수료율은 필수입력사항입니다.',
    loanBalAmt: '대출잔액은 필수입력사항입니다.'
  };
  // 등록/변경 공통 필수 날짜, UPDATE에서만 추가로 필수인 날짜(자동설정 필드지만 NOT NULL 컬럼) --
  // 기한이익상실일자는 nullable이라 비어있는 건 허용하고, 값이 있을 때만 형식을 검사한다.
  const REQUIRED_DATE_FIELD_LABELS = { newDt: '신규일자', matDt: '만기일자' };
  const UPDATE_ONLY_REQUIRED_DATE_FIELD_LABELS = {
    nextIntPayDt: '다음이자납입일자', nextRepayDt: '다음상환일자',
    lastIntPayDt: '최종이자납입일자', lastRepayDt: '최종상환일자'
  };

  ['c-loanLimitAmt', 'c-loanBalAmt'].forEach(id => attachAmountFormatting($(id)));
  ['c-baseRate', 'c-addRate', 'c-earlyRepayFeeRate'].forEach(id => attachRateFormatting($(id)));
  // 날짜를 캘린더 선택 없이 키패드로 바로 입력할 수 있도록 -- 네이티브 date input 대신 텍스트+자동포맷.
  ['c-newDt', 'c-matDt', 'c-nextIntPayDt', 'c-nextRepayDt', 'c-lastIntPayDt', 'c-lastRepayDt', 'c-deadlineLossDt']
    .forEach(id => attachDateFormatting($(id)));

  function toYyyymmdd(isoDate) {
    return isoDate ? isoDate.replaceAll('-', '') : null;
  }
  function toIsoDateInput(yyyymmdd) {
    return yyyymmdd ? `${yyyymmdd.slice(0, 4)}-${yyyymmdd.slice(4, 6)}-${yyyymmdd.slice(6, 8)}` : '';
  }

  function updateAppliedRate() {
    const base = parseFloat($('c-baseRate').value);
    const add = parseFloat($('c-addRate').value);
    $('c-applyRate').value = (!isNaN(base) && !isNaN(add)) ? (base + add).toFixed(2) : '';
  }
  $('c-baseRate').addEventListener('input', updateAppliedRate);
  $('c-addRate').addEventListener('input', updateAppliedRate);

  // CHECK ck_lon_acct_base_rate_change_cycle: 고정금리(01)면 주기 NULL, 변동금리(02)면 주기 필수.
  // 삭제 모드(전체 잠금)에서는 건드리지 않는다 -- 잠금을 풀어버리면 안 됨.
  function applyRateChangeCycleConstraint() {
    if (txnType === 'DELETE') return;
    const isFixed = $('c-rateChangeTypeCd').value === '01';
    $('c-rateChangeCycle').disabled = isFixed;
    if (isFixed) $('c-rateChangeCycle').value = '';
  }
  $('c-rateChangeTypeCd').addEventListener('change', applyRateChangeCycleConstraint);

  function setFieldsLocked(locked) {
    LOCKABLE_FIELD_IDS.forEach(id => {
      const el = $('c-' + id);
      if (el.tagName === 'SELECT') el.disabled = locked;
      else el.readOnly = locked;
    });
  }

  // 등록/변경 처리 전 필수입력 검증 -- 첫 번째로 발견된 문제의 메시지를 반환, 문제 없으면 null.
  function validateFormForSubmit() {
    const requiredIds = txnType === 'UPDATE'
      ? Object.keys(REQUIRED_FIELD_MESSAGES)
      : Object.keys(REQUIRED_FIELD_MESSAGES).filter(id => id !== 'loanBalAmt');
    for (const id of requiredIds) {
      if (!$('c-' + id).value.trim()) return REQUIRED_FIELD_MESSAGES[id];
    }

    // 날짜는 이제 키패드로 직접 타이핑하는 텍스트 입력이라 네이티브 date input과 달리 브라우저가
    // 형식을 걸러주지 않는다 -- 자릿수/월일 범위를 여기서 직접 검증한다.
    const dateFieldsToCheck = txnType === 'UPDATE'
      ? { ...REQUIRED_DATE_FIELD_LABELS, ...UPDATE_ONLY_REQUIRED_DATE_FIELD_LABELS }
      : REQUIRED_DATE_FIELD_LABELS;
    for (const [id, label] of Object.entries(dateFieldsToCheck)) {
      if (!isValidDateInput($('c-' + id).value.trim())) {
        return `${label}를 올바른 날짜(YYYYMMDD 8자리)로 입력해주세요.`;
      }
    }
    // 기한이익상실일자는 nullable이라 비어있는 건 허용, 값이 있으면 형식만 검사.
    const deadlineLossDt = $('c-deadlineLossDt').value.trim();
    if (txnType === 'UPDATE' && deadlineLossDt && !isValidDateInput(deadlineLossDt)) {
      return '기한이익상실일자를 올바른 날짜(YYYYMMDD 8자리)로 입력해주세요.';
    }

    const monthlyDay = Number($('c-monthlyIntPayDay').value.trim());
    if (!Number.isInteger(monthlyDay) || monthlyDay < 1 || monthlyDay > 31) {
      return '매월이자납입일은 1~31 사이의 숫자로 입력해주세요.';
    }
    if ($('c-rateChangeTypeCd').value === '02' && !$('c-rateChangeCycle').value) {
      return '금리변동주기는 변동금리 선택 시 필수입력사항입니다.';
    }
    if ($('c-matDt').value <= $('c-newDt').value) {
      return '만기일자는 신규일자보다 이후 날짜로 입력해주세요.';
    }
    return null;
  }

  function updateLookupLabel() {
    $('c-modeLabel').textContent = editingAccount
      ? `선택됨: ${editingAccount.acctNo}-${editingAccount.acctSeqNo}`
      : '계좌를 검색해 불러오세요.';
  }

  // 처리구분(등록/변경/삭제)에 맞춰 조회 카드, 자동설정 필드, 잠금 상태, 처리 버튼을 갱신한다.
  function applyTxnType(type) {
    txnType = type;
    const isCreate = type === 'CREATE';
    const isDelete = type === 'DELETE';

    $('c-lookupCard').style.display = isCreate ? 'none' : '';
    document.querySelectorAll('#view-account-create .c-auto-field').forEach(el => {
      el.style.display = isCreate ? 'none' : '';
    });
    setFieldsLocked(isDelete);
    applyRateChangeCycleConstraint();

    const btn = $('c-submitBtn');
    if (isCreate) {
      btn.className = 'primary';
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.textContent = '등록';
    } else if (type === 'UPDATE') {
      btn.className = 'primary';
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.textContent = '수정 저장';
    } else {
      btn.className = 'secondary';
      btn.style.borderColor = 'var(--color-danger)';
      btn.style.color = 'var(--color-danger)';
      btn.textContent = '계좌 삭제';
    }
  }

  function showFormMsg(message, isError) {
    const el = $('c-formMsg');
    el.textContent = message;
    el.style.color = isError ? 'var(--color-danger)' : 'var(--color-weak-fg)';
    el.style.display = 'block';
  }

  function resetForm() {
    editingAccount = null;
    ['acctNo', 'acctSeqNo', 'custNo', 'custName', 'loanLimitAmt', 'loanBalAmt',
      'newDt', 'matDt', 'nextIntPayDt', 'nextRepayDt', 'lastIntPayDt', 'lastRepayDt', 'deadlineLossDt',
      'monthlyIntPayDay', 'baseRate', 'addRate', 'earlyRepayFeeRate', 'rateChangeCycle'].forEach(f => {
      $('c-' + f).value = '';
    });
    $('c-applyRate').value = '';
    $('c-acctStatCd').value = '01';
    $('c-itemCd').value = '01';
    $('c-repayMethodCd').value = '01';
    $('c-rateChangeTypeCd').value = '01';
    // 등록 모드는 신규일자를 오늘 날짜로 기본 세팅 -- 변경/삭제는 계좌검색으로 값이 채워지므로 비워둔다.
    if ($('c-txnType').value === 'CREATE') {
      $('c-newDt').value = isoDate(new Date());
    }
    updateLookupLabel();
    $('c-formMsg').style.display = 'none';
  }

  function fullReset() {
    $('c-txnType').value = 'CREATE';
    resetForm();
    applyTxnType('CREATE');
  }

  // 계좌검색 팝업(변경/삭제 대상 선택)과 등록 성공 직후(결과 확인) 양쪽에서 호출된다.
  function fillFormForEdit(account) {
    editingAccount = { acctNo: account.acctNo, acctSeqNo: account.acctSeqNo };
    $('c-acctNo').value = account.acctNo;
    $('c-acctSeqNo').value = account.acctSeqNo;
    $('c-custNo').value = account.custNo;
    $('c-custName').value = account.custName;
    $('c-acctStatCd').value = account.acctStatCd;
    $('c-itemCd').value = account.itemCd;
    $('c-loanLimitAmt').value = Number(account.loanLimitAmt).toLocaleString('ko-KR');
    $('c-loanBalAmt').value = Number(account.loanBalAmt).toLocaleString('ko-KR');
    $('c-newDt').value = toIsoDateInput(account.newDt);
    $('c-matDt').value = toIsoDateInput(account.matDt);
    $('c-nextIntPayDt').value = toIsoDateInput(account.nextIntPayDt);
    $('c-nextRepayDt').value = toIsoDateInput(account.nextRepayDt);
    $('c-lastIntPayDt').value = toIsoDateInput(account.lastIntPayDt);
    $('c-lastRepayDt').value = toIsoDateInput(account.lastRepayDt);
    $('c-deadlineLossDt').value = toIsoDateInput(account.deadlineLossDt);
    $('c-monthlyIntPayDay').value = account.monthlyIntPayDay || '';
    $('c-baseRate').value = (Number(account.baseRate) * 100).toFixed(2);
    $('c-addRate').value = (Number(account.addRate) * 100).toFixed(2);
    $('c-earlyRepayFeeRate').value = (Number(account.earlyRepayFeeRate) * 100).toFixed(2);
    updateAppliedRate();
    $('c-repayMethodCd').value = account.repayMethodCd;
    $('c-rateChangeTypeCd').value = account.rateChangeTypeCd;
    $('c-rateChangeCycle').value = account.rateChangeCycle || '';
    applyRateChangeCycleConstraint();
    updateLookupLabel();
    $('c-formMsg').style.display = 'none';
  }

  // 등록(POST) 전용 -- 화면이 실제로 입력받는 항목만 보낸다. 계좌상태/잔액/납입일자 등은
  // loan-ledger-service가 계산해서 채운다 (LedgerAccountService.register 참고).
  function buildCreatePayload() {
    return {
      custNo: $('c-custNo').value.trim(),
      custName: $('c-custName').value.trim(),
      itemCd: $('c-itemCd').value,
      loanLimitAmt: parseAmount($('c-loanLimitAmt')),
      newDt: toYyyymmdd($('c-newDt').value),
      matDt: toYyyymmdd($('c-matDt').value),
      monthlyIntPayDay: $('c-monthlyIntPayDay').value.trim(),
      baseRate: parseFloat($('c-baseRate').value) / 100,
      addRate: parseFloat($('c-addRate').value) / 100,
      applyRate: parseFloat($('c-applyRate').value) / 100,
      earlyRepayFeeRate: parseFloat($('c-earlyRepayFeeRate').value) / 100,
      repayMethodCd: $('c-repayMethodCd').value,
      rateChangeTypeCd: $('c-rateChangeTypeCd').value,
      rateChangeCycle: $('c-rateChangeTypeCd').value === '02' ? $('c-rateChangeCycle').value : null
    };
  }

  // 변경(PUT) 전용 -- PK를 제외한 전체 컬럼을 보낸다.
  function buildUpdatePayload() {
    return {
      custNo: $('c-custNo').value.trim(),
      custName: $('c-custName').value.trim(),
      acctStatCd: $('c-acctStatCd').value,
      itemCd: $('c-itemCd').value,
      applyNo: null,
      approvalNo: null,
      loanLimitAmt: parseAmount($('c-loanLimitAmt')),
      loanBalAmt: parseAmount($('c-loanBalAmt')),
      newDt: toYyyymmdd($('c-newDt').value),
      matDt: toYyyymmdd($('c-matDt').value),
      nextIntPayDt: toYyyymmdd($('c-nextIntPayDt').value),
      nextRepayDt: toYyyymmdd($('c-nextRepayDt').value),
      lastIntPayDt: toYyyymmdd($('c-lastIntPayDt').value),
      lastRepayDt: toYyyymmdd($('c-lastRepayDt').value),
      deadlineLossDt: toYyyymmdd($('c-deadlineLossDt').value),
      monthlyIntPayDay: $('c-monthlyIntPayDay').value.trim(),
      baseRate: parseFloat($('c-baseRate').value) / 100,
      addRate: parseFloat($('c-addRate').value) / 100,
      applyRate: parseFloat($('c-applyRate').value) / 100,
      earlyRepayFeeRate: parseFloat($('c-earlyRepayFeeRate').value) / 100,
      repayMethodCd: $('c-repayMethodCd').value,
      rateChangeTypeCd: $('c-rateChangeTypeCd').value,
      rateChangeCycle: $('c-rateChangeTypeCd').value === '02' ? $('c-rateChangeCycle').value : null,
      virtualAcctNo: null
    };
  }

  async function submitRegister() {
    const validationError = validateFormForSubmit();
    if (validationError) {
      showErrorModal(validationError);
      return;
    }
    const payload = buildCreatePayload();
    const btn = $('c-submitBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>등록 중...';
    try {
      const res = await fetch(`${LEDGER_SERVICE_BASE}/api/v1/ledger/accounts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '등록 중 오류가 발생했습니다.');
      // 등록 성공 후 자동 채번/설정된 값을 바로 확인할 수 있도록 변경 모드로 전환해 채워준다.
      $('c-txnType').value = 'UPDATE';
      applyTxnType('UPDATE');
      fillFormForEdit(data);
      showFormMsg(`계좌가 등록되었습니다. (계좌번호: ${data.acctNo}-${data.acctSeqNo})`, false);
      btn.disabled = false;
    } catch (e) {
      showErrorModal(e.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function submitUpdate() {
    const validationError = validateFormForSubmit();
    if (validationError) {
      showErrorModal(validationError);
      return;
    }
    const btn = $('c-submitBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>저장 중...';
    try {
      const res = await fetch(`${LEDGER_SERVICE_BASE}/api/v1/ledger/accounts/${editingAccount.acctNo}/${editingAccount.acctSeqNo}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildUpdatePayload())
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || '수정 중 오류가 발생했습니다.');
      fillFormForEdit(data);
      showFormMsg('계좌 정보가 수정되었습니다.', false);
    } catch (e) {
      showErrorModal(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function submitDelete() {
    if (!confirm(`계좌 ${editingAccount.acctNo}-${editingAccount.acctSeqNo}를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
    try {
      const res = await fetch(`${LEDGER_SERVICE_BASE}/api/v1/ledger/accounts/${editingAccount.acctNo}/${editingAccount.acctSeqNo}`, {
        method: 'DELETE'
      });
      if (!res.ok && res.status !== 204) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.message || '삭제 중 오류가 발생했습니다.');
      }
      resetForm();
      showFormMsg('계좌가 삭제되었습니다.', false);
    } catch (e) {
      showErrorModal(e.message);
    }
  }

  function submitTxn() {
    if (txnType === 'CREATE') return submitRegister();
    if (!editingAccount) {
      showErrorModal('먼저 계좌를 검색해 불러와주세요.');
      return;
    }
    return txnType === 'UPDATE' ? submitUpdate() : submitDelete();
  }

  $('c-txnType').addEventListener('change', () => {
    resetForm();
    applyTxnType($('c-txnType').value);
  });
  $('c-acctSearchBtn').addEventListener('click', () => {
    window.openAccountSearchModal(fillFormForEdit);
  });
  $('c-submitBtn').addEventListener('click', submitTxn);
  $('c-resetBtn').addEventListener('click', fullReset);

  fullReset();
  VIEW_RESETTERS['account-create'] = fullReset;
})();

// ================= 원장조회 view =================
(function () {
  let lastAccounts = [];

  function renderAccounts(accounts) {
    lastAccounts = accounts;
    if (!accounts.length) {
      $('l-resultArea').innerHTML = '<div class="placeholder">조회된 원장이 없습니다.</div>';
      return;
    }

    const rows = accounts.map((a, idx) => `
      <tr>
        <td>${a.acctNo}</td>
        <td>${a.acctSeqNo}</td>
        <td>${a.custNo}</td>
        <td>${a.custName}</td>
        <td>${ACCT_STAT_LABELS[a.acctStatCd] || a.acctStatCd}</td>
        <td>${ITEM_LABELS[a.itemCd] || a.itemCd}</td>
        <td class="num">${formatWon(a.loanLimitAmt)}</td>
        <td class="num">${formatWon(a.loanBalAmt)}</td>
        <td>${formatDtDash(a.newDt)}</td>
        <td>${formatDtDash(a.matDt)}</td>
        <td class="num">${formatRatePct(a.applyRate)}</td>
        <td>${REPAY_METHOD_LABELS[a.repayMethodCd] || a.repayMethodCd}</td>
        <td>${rateChangeInfoText(a) || '-'}</td>
        <td><button type="button" class="secondary btn-sm" data-idx="${idx}">입금 계산에 사용</button></td>
      </tr>
    `).join('');

    $('l-resultArea').innerHTML = `
      <div class="ledger-table-wrap">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>계좌번호</th><th>일련</th><th>고객번호</th><th>고객명</th><th>상태</th><th>과목</th>
              <th class="num">대출한도</th><th class="num">대출잔액</th>
              <th>신규일자</th><th>만기일자</th><th class="num">적용금리</th><th>상환방식</th><th>금리유형</th><th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    $('l-resultArea').querySelectorAll('button[data-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        window.fillDepositFormFromLedger(lastAccounts[Number(btn.dataset.idx)]);
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelector('.nav-item[data-view="deposit"]').classList.add('active');
        $('view-deposit').classList.add('active');
      });
    });
  }

  async function loadAccounts() {
    const keyword = $('l-keyword').value.trim();
    $('l-resultArea').innerHTML = '<div class="placeholder">불러오는 중...</div>';
    try {
      const url = new URL(`${LEDGER_SERVICE_BASE}/api/v1/ledger/accounts`);
      if (keyword) url.searchParams.set('keyword', keyword);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderAccounts(await res.json());
    } catch (e) {
      $('l-resultArea').innerHTML = `<div class="error" style="display:block;">원장 조회 중 오류가 발생했습니다: ${e.message}</div>`;
    }
  }

  $('l-searchBtn').addEventListener('click', loadAccounts);
  $('l-keyword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadAccounts();
  });

  $('l-acctSearchBtn').addEventListener('click', () => {
    window.openAccountSearchModal((account) => {
      $('l-keyword').value = account.acctNo;
      loadAccounts();
    });
  });

  let loaded = false;
  VIEW_ON_FIRST_SHOW.ledger = () => {
    if (!loaded) {
      loaded = true;
      loadAccounts();
    }
  };

  function resetLedgerView() {
    loaded = false;
    lastAccounts = [];
    $('l-keyword').value = '';
    $('l-resultArea').innerHTML = '<div class="placeholder">조회 버튼을 눌러 원장을 확인하세요. 계좌를 찾으면 "입금 계산에 사용" 버튼으로 입금 화면에 값을 바로 채울 수 있습니다.</div>';
  }

  $('l-resetBtn').addEventListener('click', resetLedgerView);
  VIEW_RESETTERS.ledger = resetLedgerView;
})();

// ================= 입금 view =================
(function () {
  let selectedAccount = null;
  const REPAY_METHOD_TO_TYPE = { '01': 'EQUAL_PRINCIPAL_AND_INTEREST', '02': 'EQUAL_PRINCIPAL', '03': 'BULK' };
  const DEPOSIT_DISPLAY_FIELDS = [
    'custName', 'acctStatCd', 'itemCd', 'repayMethodCd', 'newDt', 'matDt',
    'loanLimitAmt', 'loanBalAmt', 'applyRate', 'rateChangeInfo', 'monthlyIntPayDay',
    'lastIntPayDt', 'nextIntPayDt', 'lastRepayDt', 'nextRepayDt', 'deadlineLossDt'
  ];

  function resetDepositView() {
    selectedAccount = null;
    $('d-acctNo').value = '';
    DEPOSIT_DISPLAY_FIELDS.forEach(f => { $('d-' + f).value = ''; });
    $('d-referenceDate').value = isoDate(new Date());
    $('d-calcBtn').disabled = true;
    $('d-resultArea').innerHTML = '<div class="placeholder">계좌를 선택하고 1회차 계산하기를 눌러주세요.</div>';
  }
  $('d-referenceDate').value = isoDate(new Date());

  function applyAccountToFields(account) {
    selectedAccount = account;
    $('d-acctNo').value = account.acctNo;
    $('d-custName').value = account.custName;
    $('d-acctStatCd').value = ACCT_STAT_LABELS[account.acctStatCd] || account.acctStatCd;
    $('d-itemCd').value = ITEM_LABELS[account.itemCd] || account.itemCd;
    $('d-repayMethodCd').value = REPAY_METHOD_LABELS[account.repayMethodCd] || account.repayMethodCd;
    $('d-newDt').value = formatDtDash(account.newDt);
    $('d-matDt').value = formatDtDash(account.matDt);
    $('d-loanLimitAmt').value = formatWon(account.loanLimitAmt);
    $('d-loanBalAmt').value = formatWon(account.loanBalAmt);
    $('d-applyRate').value = formatRatePct(account.applyRate);
    $('d-rateChangeInfo').value = rateChangeInfoText(account) || '-';
    $('d-monthlyIntPayDay').value = account.monthlyIntPayDay + '일';
    $('d-lastIntPayDt').value = formatDtDash(account.lastIntPayDt);
    $('d-nextIntPayDt').value = formatDtDash(account.nextIntPayDt);

    $('d-calcBtn').disabled = false;
    $('d-resultArea').innerHTML = '<div class="placeholder">1회차 계산하기를 눌러주세요.</div>';
  }

  // 원장조회 화면의 "입금 계산에 사용" 버튼에서 호출한다 (위 원장조회 view IIFE 참고).
  window.fillDepositFormFromLedger = applyAccountToFields;

  $('d-acctSearchBtn').addEventListener('click', () => {
    window.openAccountSearchModal(applyAccountToFields);
  });

  function toIsoOrNull(yyyymmdd) {
    return yyyymmdd ? formatDtDash(yyyymmdd) : null;
  }

  const STATUS_BADGE_CLASS = { NORMAL: 'ontime', OVERDUE_INSTALLMENT: 'overdue', ACCELERATED: 'overdue' };

  async function calcFirstInstallment() {
    if (!selectedAccount) return;
    const referenceDate = $('d-referenceDate').value;
    if (!referenceDate) {
      $('d-resultArea').innerHTML = '<div class="error" style="display:block;">계산기준일자를 입력해주세요.</div>';

      lastIntPayDt: toIsoOrNull(selectedAccount.lastIntPayDt),

      maturityDate: toIsoOrNull(selectedAccount.matDt),
      deadlineLossDt: toIsoOrNull(selectedAccount.deadlineLossDt),
      referenceDate,
      baseRate: Number(selectedAccount.baseRate),
      spreadRate: Number(selectedAccount.addRate),
      outstandingPrincipal: Number(selectedAccount.loanBalAmt)
    };

    const calcBtn = $('d-calcBtn');
    const originalLabel = calcBtn.textContent;
    calcBtn.disabled = true;
    calcBtn.innerHTML = '<span class="spinner"></span>계산 중...';
    const slowHintTimer = setTimeout(() => {
      calcBtn.innerHTML = '<span class="spinner"></span>서버를 깨우는 중... (최대 50초)';
    }, 4000);
    $('d-resultArea').innerHTML = '<div class="placeholder">불러오는 중...</div>';
    try {
      const res = await fetch(`${SCHEDULE_SERVICE_BASE}/api/v1/repayment-schedules/current-installment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const r = await res.json();
      if (!res.ok) throw new Error(r.message || '1회차 조회 중 오류가 발생했습니다.');

      const badgeClass = STATUS_BADGE_CLASS[r.status] || 'ontime';
      const badge = `<span class="badge ${badgeClass}">${r.statusLabel}</span>`;

      let overdueRows = '';
      if (r.overdueDays > 0) {
        overdueRows += `
          <tr><td class="label">원금연체이자 (${r.overdueDays}일)</td><td class="value">${formatWon(r.overduePrincipalInterest)}</td></tr>
          <tr><td class="label">연체이자 (${r.overdueDays}일)</td><td class="value">${formatWon(r.overdueInterest)}</td></tr>
        `;
      }
      let accelerationRows = '';
      if (r.accelerationDays > 0) {
        accelerationRows = `
          <tr><td class="label">기한이익상실 원금연체이자<br><span style="font-weight:400; color: var(--color-muted);">(${r.accelerationStartDate} ~ 기준일자, ${r.accelerationDays}일, 잔액 전체)</span></td><td class="value">${formatWon(r.acceleratedPrincipalInterest)}</td></tr>
        `;
      }

      $('d-resultArea').innerHTML = `
        <div class="meta">회차 구간: <strong>${r.periodStart} ~ ${r.periodEnd}</strong> ${badge}</div>
        <table class="result-table">
          <tr><td class="label">원금</td><td class="value">${formatWon(r.principal)}</td></tr>
          <tr><td class="label">이자</td><td class="value">${formatWon(r.interest)}</td></tr>
          ${overdueRows}
          ${accelerationRows}
          <tr class="total"><td class="label">기준일자 납부금액</td><td class="value">${formatWon(r.totalDueAmount)}</td></tr>
        </table>
      `;
    } catch (e) {
      $('d-resultArea').innerHTML = `<div class="error" style="display:block;">${e.message}</div>`;
    } finally {
      clearTimeout(slowHintTimer);
      calcBtn.disabled = false;
      calcBtn.textContent = originalLabel;
    }
  }

  $('d-calcBtn').addEventListener('click', calcFirstInstallment);
  $('d-resetBtn').addEventListener('click', resetDepositView);
  VIEW_RESETTERS.deposit = resetDepositView;
})();
</script>
</body>
</html>
