spring.application.name=loan-schedule-service
# Local dev defaults to 8082; a hosted platform that injects PORT overrides this.
server.port=${PORT:8082}

# Local dev defaults match docker-compose.yml at the repo root (db/init.sql owns the schema).
# In production, override these four via env vars to point at the managed Postgres add-on.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loandb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:loanuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:loanpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by db/init.sql, not Hibernate or a migration tool (demo project, no Flyway/Liquibase yet).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# loan-engine-service's static page (served from a different origin/port) calls this service directly.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}
