spring.application.name=loan-schedule-service
# Local dev defaults to 8083; a hosted platform that injects PORT overrides this.
server.port=${PORT:8083}

# 연체가산이율 3%p (현재 회차/연체 계산에 사용; loan-engine-service와 동일 기본값)
loan.policy.overdue-rate-add-on=0.03
loan.policy.days-in-year=365

# Called cross-origin from the loan-calcurator screen module.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Server-to-server call (not from the browser) to loan-code-service's holiday table, used by
# BusinessDayCalendar for the 영업일(+1영업일) rule. Falls back to weekday-only if unreachable.
app.code-service.base-url=${CODE_SERVICE_BASE_URL:http://localhost:8082}
